  - {id: kb-card-2, ask: 临时锁卡跟挂失有啥不一样, expect: faq-card-lock-vs-loss}
  - {id: kb-card-3, ask: 信用卡挂失要钱吗, expect: faq-card-loss-fee}
  - {id: kb-card-4, ask: 补办借记卡工本费多少钱, expect: faq-card-loss-fee}
  - {id: kb-card-5, ask: 出国旅游刷卡需要开通什么功能, expect: faq-card-overseas}
  - {id: kb-card-6, ask: 单日限额调高需要什么验证, expect: faq-card-limit-rule}
  - {id: kb-card-7, ask: 虚拟卡和实体卡有什么不同, expect: faq-virtual-card}
  - {id: kb-card-8, ask: 信用卡免息期最长多少天, expect: faq-credit-repay}
  - {id: kb-card-9, ask: 信用卡晚还两天会上征信吗, expect: faq-credit-overdue}

  # ---------- 理财通用规则 ----------
  - {id: kb-wm-1, ask: 理财产品写着R3代表什么, expect: faq-wm-risk-level}
  - {id: kb-wm-2, ask: 风险测评做完能管多长时间, expect: faq-wm-assessment}
  - {id: kb-wm-3, ask: 稳健型客户能买R4的产品吗, expect: faq-wm-suitability}
  - {id: kb-wm-4, ask: 理财卖出后钱几天到账, expect: faq-wm-redeem-arrival}
  - {id: kb-wm-5, ask: 定期理财还没到期可以提前取出吗, expect: faq-wm-closed-period}
  - {id: kb-wm-6, ask: 业绩比较基准3%是不是一定能拿到, expect: faq-wm-benchmark}
  - {id: kb-wm-7, ask: 买理财有没有申购费, expect: [faq-wm-fees, prod-wm06-redeem, prod-wm07-redeem]}

  # ---------- 产品说明（虚构产品）----------
  - {id: kb-prod-1, ask: 稳盈30天能提前赎回吗, expect: [prod-wm02-redeem, prod-wm02]}
  - {id: kb-prod-2, ask: 活钱宝赎回当天能到账吗, expect: prod-wm01-redeem}
  - {id: kb-prod-3, ask: 年年盈起购金额是多少, expect: prod-wm03}
  - {id: kb-prod-4, ask: 科技成长股票持有不满一个月赎回扣多少钱, expect: prod-wm07-redeem}
  - {id: kb-prod-5, ask: 稳健增利赎回费怎么收, expect: prod-wm05-redeem}
  - {id: kb-prod-6, ask: 安享90天风险等级是多少, expect: prod-wm04}
  - {id: kb-prod-7, ask: 均衡配置混合是什么类型的产品, expect: prod-wm06}

  # ---------- 订阅和商户取消指引 ----------
  - {id: kb-sub-1, ask: 停了代扣以后爱奇艺会员还会续费吗, expect: [faq-sub-stop-vs-cancel, mc-iqiyi], or_card: sub_guide}
  - {id: kb-sub-2, ask: 免密支付到底是什么, expect: faq-sub-withhold}
  - {id: kb-sub-3, ask: 腾讯视频的连续包月在哪里关, expect: mc-tencent-video, or_card: sub_guide}
  - {id: kb-sub-4, ask: 网易云黑胶会员自动续费怎么关闭, expect: mc-netease-music, or_card: sub_guide}
  - {id: kb-sub-5, ask: B站大会员自动续费在哪关, expect: mc-bilibili}
  - {id: kb-sub-6, ask: iPhone上的订阅扣费去哪里取消, expect: mc-app-store}
  - {id: kb-sub-7, ask: 支付宝里的自动扣款服务怎么停, expect: mc-alipay}

  # ---------- 其他规则 ----------
  - {id: kb-misc-1, ask: 银行存款保险最多赔多少, expect: faq-deposit-insurance}
  - {id: kb-misc-2, ask: 公安让我把钱转到安全账户是真的吗, expect: faq-anti-fraud}
  - {id: kb-misc-3, ask: 心愿罐里的钱可以随时拿回来吗, expect: faq-wish-pot}

