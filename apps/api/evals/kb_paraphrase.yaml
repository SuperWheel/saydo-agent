# 知识问答换说法难题集：问法刻意避开条目标题和问法（q）里的字眼，检验向量检索和重排能不能听懂换了说法的问题。
# 超范围题是贴近银行业务、但知识库里没有的问题（房贷、基金定投、汇率……），检验会不会被字面相近的条目误命中。
# 格式同 evals/kb.yaml；`uv run python scripts/kb_eval.py --set paraphrase`。
# 门槛（SIM_FLOOR / SIM_SURE / RERANK_MIN_SCORE）都在 kb.yaml 上校准，这套题只用来检验，不要拿它调门槛。

