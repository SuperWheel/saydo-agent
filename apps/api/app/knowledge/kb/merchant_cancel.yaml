# 商户取消指引子库（演示数据）：常见订阅商户在商户侧关闭自动续费的一般路径。
# 团队整理，未逐一向商户核实；商户 App 改版后菜单名称可能不同，一律写成「一般路径」，以商户 App 实际页面为准。
#
# 每条：
#   id        条目编号
#   merchant  对应的登记商户规范名（core_mock/merchants.py）；没登记的商户不填，只参与检索
#   name      用户口语里的叫法，用于标题
#   where     在哪里取消
#   steps     取消步骤，按顺序
#   tips      补充提醒
#   q         用户可能的问法，只参与检索
# 中国移动话费这类只有本行代扣、商户侧没有会员订阅的，停止本行代扣即可，这里只写停了之后要注意的事。

library: merchant_cancel
name: 商户取消指引
kind: 商户公开信息整理（一般路径，演示）
version: kb-2026-10
effective: 2026-10-01

common_tips:
  - 关闭自动续费后，已付费的当期会员一般可以用到期末
  - 如果是通过手机系统的应用商店（App Store、应用市场）订阅的，要在应用商店的订阅管理里取消

entries:
  - id: mc-iqiyi
    merchant: 爱奇艺VIP会员
    name: 爱奇艺VIP会员
    where: 爱奇艺 App
    steps: [打开爱奇艺 App，进入「我的」, 进入「VIP会员」或「设置」里的「自动续费管理」, 选择正在续费的会员，点击「关闭自动续费」并确认]
    q: [爱奇艺会员怎么取消自动续费, 爱奇艺怎么退订, 关闭爱奇艺连续包月]

  - id: mc-tencent-video
    merchant: 腾讯视频VIP
    name: 腾讯视频VIP
    where: 腾讯视频 App
    steps: [打开腾讯视频 App，进入「个人中心」, 点击「VIP会员」，找到「自动续费管理」, 关闭对应会员的自动续费并确认]
    q: [腾讯视频会员怎么取消自动续费, 腾讯视频怎么退订, 关闭腾讯视频连续包月]

  - id: mc-netease-music
    merchant: 网易云音乐
    name: 网易云音乐黑胶VIP
    where: 网易云音乐 App
    steps: [打开网易云音乐 App，点击左上角菜单, 进入「设置」或「会员中心」里的「自动续费管理」, 选择黑胶VIP的自动续费，点击关闭并确认]
    q: [网易云音乐会员怎么取消自动续费, 网易云黑胶怎么退订, 网易云连续包月怎么关]

  - id: mc-qq-music
    merchant: QQ音乐
    name: QQ音乐绿钻 / 会员
    where: QQ音乐 App
    steps: [打开QQ音乐 App，进入「我的」, 点击会员标识进入「会员中心」, 找到「自动续费管理」，关闭对应会员的自动续费]
    q: [QQ音乐会员怎么取消自动续费, QQ音乐绿钻怎么退订, QQ音乐连续包月怎么关]

  - id: mc-keep
    merchant: Keep会员
    name: Keep会员
    where: Keep App
    steps: [打开 Keep App，进入「我的」, 进入「会员中心」或「设置」里的「自动续费管理」, 关闭会员的自动续费并确认]
    q: [Keep会员怎么取消自动续费, Keep怎么退订, 关闭Keep连续包月]

  - id: mc-china-mobile
    merchant: 中国移动话费
    name: 中国移动话费自动缴费
    where: 本行手机银行
    steps: [话费自动缴费只靠本行代扣协议扣款，在手机银行停止本行代扣即可, 停止后以后需要自己缴纳话费，号码和套餐不受影响]
    q: [话费自动缴费怎么取消, 中国移动自动交话费怎么停, 不想自动缴话费了]
    tips: [停止前确认话费余额充足，避免因欠费停机]

  - id: mc-youku
    name: 优酷VIP会员
    where: 优酷 App
    steps: [打开优酷 App，进入「我的」, 进入「会员中心」或「设置」里的「自动续费管理」, 关闭对应会员的自动续费]
    q: [优酷会员怎么取消自动续费, 优酷怎么退订]

  - id: mc-bilibili
    name: 哔哩哔哩大会员
    where: 哔哩哔哩 App
    steps: [打开哔哩哔哩 App，进入「我的」, 点击「我的大会员」，找到「自动续费管理」, 关闭自动续费并确认]
    q: [B站大会员怎么取消自动续费, 哔哩哔哩大会员怎么退订, b站连续包月怎么关]

  - id: mc-app-store
    name: App Store 订阅
    where: iPhone「设置」
    steps: [打开 iPhone「设置」，点击顶部的 Apple 账户名称, 进入「订阅」, 选择要取消的订阅，点击「取消订阅」]
    q: [苹果订阅怎么取消, App Store 自动扣费怎么关, iPhone 订阅怎么退]

  - id: mc-wechat-pay
    name: 微信支付自动扣费
    where: 微信 App
    steps: [打开微信，进入「我」→「服务」→「钱包」, 进入「支付设置」→「自动续费」或「扣费服务」, 选择对应服务，关闭扣费服务]
    q: [微信自动扣费怎么关, 微信免密支付怎么取消, 微信里的自动续费在哪]
    tips: [经微信支付扣款的订阅不是本行协议，本行无法直接停止]

  - id: mc-alipay
    name: 支付宝自动扣款
    where: 支付宝 App
    steps: [打开支付宝，进入「我的」→「设置」, 进入「支付设置」→「免密支付 / 自动扣款」, 选择对应服务，点击「关闭服务」]
    q: [支付宝自动扣款怎么关, 支付宝免密支付怎么取消, 支付宝里的自动续费在哪]
    tips: [经支付宝扣款的订阅不是本行协议，本行无法直接停止]
