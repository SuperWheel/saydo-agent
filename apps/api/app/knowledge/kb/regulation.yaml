# 监管法规要点子库：法律、行政法规、监管规章和规范性文件里与六个场景相关的要点。
#
# 编写约定（入库前双人审核）：
# - 只写核实过原文的条款：2026-10-31 逐条对照官方或政府网站转载的原文（链接见各条 basis.url，没有政府网站全文链接的不写 url）。
#   核实不了的文件、文号、条款和数字一律不写（资管新规正式文本、各投诉热线号码、《支付结算办法》本次未核到原文，没有收录）。
# - 引用原文要点，不大段照抄；条文和本行演示参数冲突时以代码为准，本行规则写在 faq.yaml（kind 为本行演示规则）。
# - 数字用阿拉伯数字；不用「保本」「保收益」「无风险」这类承诺说法（模型照抄会被事实校验拦下），说「不保本」「本金和收益可能损失」。
# - basis：doc 文件名、ref 条款、docno 文号（不能叫 no：YAML 会读成布尔值）、org 发布机构、effective 施行日期、url 官方原文（可选）。

library: regulation
name: 监管法规要点
kind: 监管 / 法规通用知识
version: kb-2026-10b
effective: 2026-10-31

entries:
  # ---------- 智能转账 ----------
  - id: reg-transfer-modes
    title: 转账可以选择实时、普通、次日到账
    q: [转账有几种到账方式, 普通到账和实时到账有什么区别, 次日到账是什么意思, 为什么转账要选到账方式]
    body: 按中国人民银行要求，银行提供转账服务时应向存款人提供实时到账、普通到账、次日到账等多种转账方式，由存款人选择后办理。选择普通或次日到账，给了发现被骗后联系银行处理的时间。
    basis:
      - {doc: 中国人民银行关于加强支付结算管理防范电信网络新型违法犯罪有关事项的通知, ref: 二（八）1, docno: 银发〔2016〕261号, org: 中国人民银行, effective: 2016-12-01, url: "https://fgw.sh.gov.cn/cmsres/e1/e1ef22169fc0490a8e63dcf0f5b2fc11/649b71468e7a8e7a448e428373d1860d.pdf"}

  - id: reg-atm-24h
    title: ATM 转账 24 小时后到账、可以撤销
    q: [ATM 转账为什么不是马上到, 在取款机上转错了能撤回吗, 自助柜员机转账多久到账]
    body: 除向本人同行账户转账外，个人通过自助柜员机（含其他有存取款功能的自助设备）转账的，发卡行在受理 24 小时后才办理资金转账；受理后 24 小时内，个人可以向发卡行申请撤销这笔转账。
    basis:
      - {doc: 中国人民银行关于加强支付结算管理防范电信网络新型违法犯罪有关事项的通知, ref: 二（八）2, docno: 银发〔2016〕261号, org: 中国人民银行, effective: 2016-12-01, url: "https://fgw.sh.gov.cn/cmsres/e1/e1ef22169fc0490a8e63dcf0f5b2fc11/649b71468e7a8e7a448e428373d1860d.pdf"}

  - id: faq-account-class
    title: Ⅰ类、Ⅱ类、Ⅲ类账户
    q: [二类户是什么, 一类卡和二类卡区别, 为什么不能再开一张一类卡, 同一家银行能开几张一类户]
    body: 个人银行结算账户分为Ⅰ类、Ⅱ类、Ⅲ类。同一个人在同一家银行只能开立一个Ⅰ类户，已有Ⅰ类户再开户的，应当开立Ⅱ类户或Ⅲ类户。Ⅱ类、Ⅲ类账户功能和限额少于Ⅰ类户，具体以开户时的约定为准。
    basis:
      - {doc: 中国人民银行关于加强支付结算管理防范电信网络新型违法犯罪有关事项的通知, ref: 一（一）1, docno: 银发〔2016〕261号, org: 中国人民银行, effective: 2016-12-01, url: "https://fgw.sh.gov.cn/cmsres/e1/e1ef22169fc0490a8e63dcf0f5b2fc11/649b71468e7a8e7a448e428373d1860d.pdf"}

  - id: reg-unjust-enrichment
    title: 转错账在法律上怎么追回
    q: [转错账对方不还怎么办, 转错钱可以起诉吗, 钱转错了对方有义务退吗, 不当得利是什么]
    body: 收款人没有法律根据取得的利益属于不当得利，受损失的人可以请求得利人返还。转错账后先联系收款人协商退回；对方拒不返还的，可以依法向人民法院起诉。银行一般不能未经收款人同意把钱从对方账户划回，但可以协助联系收款行。
    basis:
      - {doc: 中华人民共和国民法典, ref: 第九百八十五条, org: 全国人民代表大会, effective: 2021-01-01}

  # ---------- 防范电信网络诈骗 ----------
  - id: reg-fraud-no-rent
    title: 不能出租、出借、买卖银行卡和账户
    q: [把银行卡借给别人用违法吗, 有人高价收银行卡, 出租银行账户有什么后果, 帮别人走账]
    body: 任何单位和个人不得非法买卖、出租、出借电话卡、银行账户、支付账户、互联网账号等，不得提供实名核验帮助，不得假冒他人身份或者虚构代理关系开立账户。出借银行卡帮人「走账」可能被用于诈骗资金转移。
    basis:
      - {doc: 中华人民共和国反电信网络诈骗法, ref: 第三十一条第一款, org: 全国人民代表大会常务委员会, effective: 2022-12-01, url: "https://www.news.cn/2022-09/02/c_1128972464.htm"}

  - id: reg-fraud-bank-measures
    title: 银行为什么会延迟或限制我的转账
    q: [转账被延迟了是怎么回事, 银行为什么要我重新核验身份, 账户被限制非柜面交易, 可疑交易监测]
    body: 银行要对账户和支付结算服务加强监测，建立异常账户和可疑交易监测机制；对监测识别的异常账户和可疑交易，可以根据风险情况采取核实交易情况、重新核验身份、延迟支付结算、限制或者中止有关业务等防范措施。
    basis:
      - {doc: 中华人民共和国反电信网络诈骗法, ref: 第十八条第一款、第三款, org: 全国人民代表大会常务委员会, effective: 2022-12-01, url: "https://www.news.cn/2022-09/02/c_1128972464.htm"}

  - id: reg-fraud-appeal
    title: 账户被限制后可以申诉
    q: [账户被限制了怎么申诉, 被暂停办理业务怎么恢复, 误判为涉诈怎么办]
    body: 对涉诈异常情形采取限制、暂停服务等措施的，作出处置的单位应当告知处置原因、救济渠道及需要提交的资料等事项；被处置对象可以向作出决定的单位申诉，核查通过的应当即时解除有关措施。
    basis:
      - {doc: 中华人民共和国反电信网络诈骗法, ref: 第三十二条第三款, org: 全国人民代表大会常务委员会, effective: 2022-12-01, url: "https://www.news.cn/2022-09/02/c_1128972464.htm"}

  - id: reg-fraud-emergency
    title: 被骗后钱能追回来吗
    q: [被骗转账了怎么办, 被诈骗的钱能冻结吗, 紧急止付是什么, 上当受骗第一时间做什么]
    body: 国家建立电信网络诈骗涉案资金即时查询、紧急止付、快速冻结、及时解冻和资金返还制度；公安机关依法决定采取这些措施的，银行应当配合。发现被骗请立即报警，越早报警越有可能止付冻结。
    basis:
      - {doc: 中华人民共和国反电信网络诈骗法, ref: 第二十条, org: 全国人民代表大会常务委员会, effective: 2022-12-01, url: "https://www.news.cn/2022-09/02/c_1128972464.htm"}

  # ---------- 卡片：盗刷 ----------
  - id: reg-card-fraud-liability
    title: 银行卡被盗刷谁来承担损失
    q: [卡被盗刷银行赔吗, 信用卡被盗刷还要还钱吗, 网络盗刷责任怎么划分, 伪卡盗刷]
    body: 发生伪卡盗刷或网络盗刷，借记卡持卡人可以请求发卡行支付被盗刷存款本息并赔偿损失；信用卡持卡人可以请求返还扣划的透支款本息、违约金。但持卡人没有妥善保管卡片、密码、验证码等有过错的，要承担相应责任；没有及时挂失导致损失扩大的，扩大部分自行承担。
    basis:
      - {doc: 最高人民法院关于审理银行卡民事纠纷案件若干问题的规定, ref: 第七条, docno: 法释〔2021〕10号, org: 最高人民法院, effective: 2021-05-25, url: "https://www.court.gov.cn/fabu/xiangqing/304771.html"}

  - id: reg-card-fraud-evidence
    title: 被盗刷要保留哪些证据
    q: [盗刷了怎么证明不是我刷的, 被盗刷需要什么证据, 盗刷报警有用吗]
    body: 主张是伪卡盗刷或网络盗刷的，可以用这些材料证明：生效法律文书、交易时真卡所在地、交易行为地、账户交易明细、交易通知、报警记录、挂失记录等。发现盗刷后及时锁卡或挂失、报警，并保留交易短信和报警回执。
    basis:
      - {doc: 最高人民法院关于审理银行卡民事纠纷案件若干问题的规定, ref: 第四条第一款, docno: 法释〔2021〕10号, org: 最高人民法院, effective: 2021-05-25, url: "https://www.court.gov.cn/fabu/xiangqing/304771.html"}

  # ---------- 理财 ----------
  - id: reg-wm-risk-grades
    title: 理财产品风险等级至少分五级
    q: [理财风险等级有几级, 理财产品风险评级怎么分, 风险等级是谁定的]
    body: 理财产品风险评级结果以风险等级体现，由低到高至少包括一级至五级，可以进一步细分；投资者风险承受能力等级同样由低到高至少分为一级至五级。本行演示用 R1–R5 表示产品等级、C1–C5 表示测评等级。
    basis:
      - {doc: 商业银行理财业务监督管理办法, ref: 第二十七条、第二十八条, docno: 中国银行保险监督管理委员会令2018年第6号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2018-09-26, url: "https://www.gov.cn/gongbao/content/2018/content_5350052.htm"}

  - id: reg-wm-suitability
    title: 理财适当性：只能买不高于自己风险承受能力的产品
    q: [为什么不能买高风险理财, 适当性管理是什么, 风险等级不匹配能买吗, 我能不能买超过测评等级的产品]
    body: 银行只能向投资者销售风险等级等于或低于其风险承受能力等级的理财产品，并在销售系统中设置销售限制措施；要先对投资者的风险承受能力进行评估。不匹配的产品系统不会让你购买，这是监管要求，助手也不能替你绕过。
    basis:
      - {doc: 商业银行理财业务监督管理办法, ref: 第二十八条、第二十九条, docno: 中国银行保险监督管理委员会令2018年第6号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2018-09-26, url: "https://www.gov.cn/gongbao/content/2018/content_5350052.htm"}

  - id: reg-wm-not-guaranteed
    title: 理财不保本，银行不能承诺收益
    q: [理财会亏本金吗, 银行理财稳不稳, 客户经理说这款理财不会亏可信吗, 预期收益率是承诺吗]
    body: 银行销售理财产品应当向投资者充分披露信息和揭示风险，不得宣传或承诺本金和收益不受损失，不得宣传理财产品预期收益率，不得误导投资者购买与其风险承受能力不相匹配的产品。理财产品不保本，净值可能下跌，本金和收益都可能损失。
    basis:
      - {doc: 商业银行理财业务监督管理办法, ref: 第二十六条, docno: 中国银行保险监督管理委员会令2018年第6号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2018-09-26, url: "https://www.gov.cn/gongbao/content/2018/content_5350052.htm"}

  - id: reg-wm-recording
    title: 在网点买理财为什么要录音录像
    q: [买理财为什么要双录, 网点买理财录像是干什么, 理财销售专区]
    body: 银行通过营业场所向个人投资者销售理财产品，应当实施理财产品销售专区管理，并在销售专区内对每只理财产品的销售过程录音录像，便于事后核查销售是否合规。
    basis:
      - {doc: 商业银行理财业务监督管理办法, ref: 第三十二条, docno: 中国银行保险监督管理委员会令2018年第6号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2018-09-26, url: "https://www.gov.cn/gongbao/content/2018/content_5350052.htm"}

  # ---------- 订阅代扣 ----------
  - id: reg-auto-renew
    title: 自动续费商家必须提前提醒、可以随时取消
    q: [自动续费没提醒就扣钱合法吗, 会员自动续费的规定, 商家必须提供取消续费的入口吗, 自动续费前要通知吗]
    body: 网络交易经营者以自动展期、自动续费等方式提供服务的，应当在消费者接受服务前和自动续费等日期前 5 日，以显著方式提请消费者注意，由消费者自主选择；服务期间要提供显著、简便的随时取消或者变更选项，不得收取不合理费用。
    basis:
      - {doc: 网络交易监督管理办法, ref: 第十八条, docno: 国家市场监督管理总局令第37号, org: 国家市场监督管理总局, effective: 2021-05-01, url: "https://www.gov.cn/zhengce/zhengceku/2021-03/16/content_5593226.htm"}

  - id: reg-no-unilateral-fee
    title: 银行不能未经同意给我开通收费服务
    q: [银行偷偷给我开通收费服务, 被强制搭售怎么办, 未经同意开通的服务能退吗]
    body: 银行保险机构应当保障消费者自主选择权，不得强制捆绑、强制搭售产品或者服务，不得未经消费者同意单方为消费者开通收费服务，不得采用不正当手段诱使消费者购买其他产品。
    basis:
      - {doc: 银行保险机构消费者权益保护管理办法, ref: 第二十六条, docno: 中国银行保险监督管理委员会令2022年第9号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2023-03-01, url: "https://fgw.sh.gov.cn/cmsres/7d/7da9b54cc0b64677ae5b6dc71aa596fd/869e03a358291f6e8c8533c7771e280f.pdf"}

  # ---------- 跨场景购物 ----------
  - id: reg-seven-day-return
    title: 网购七日无理由退货
    q: [网上买的东西能无理由退吗, 七天无理由退货的规定, 退货运费谁出, 无理由退货多久退款]
    body: 经营者通过网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起 7 日内退货，且无需说明理由（不喜欢、不合适也可以退）。退回的商品应当完好；经营者应当自收到退回商品之日起 7 日内返还商品价款；退回运费由消费者承担，另有约定的按约定。
    basis:
      - {doc: 中华人民共和国消费者权益保护法, ref: 第二十五条, org: 全国人民代表大会常务委员会（2013 年修正）, effective: 2014-03-15}

  - id: reg-seven-day-exceptions
    title: 哪些商品不适用七日无理由退货
    q: [鲜花蛋糕能无理由退货吗, 定制商品可以退吗, 什么东西不能七天无理由, 拆封的软件能退吗]
    body: 下列商品不适用七日无理由退货：消费者定作的；鲜活易腐的；在线下载或者消费者拆封的音像制品、计算机软件等数字化商品；交付的报纸、期刊。其他根据商品性质并经消费者在购买时确认不宜退货的商品，也不适用。鲜花、蛋糕这类鲜活易腐商品通常不能无理由退货，以下单时商家的退款条件为准。
    basis:
      - {doc: 中华人民共和国消费者权益保护法, ref: 第二十五条, org: 全国人民代表大会常务委员会（2013 年修正）, effective: 2014-03-15}

  # ---------- 消费者权益保护、投诉 ----------
  - id: reg-consumer-rights
    title: 金融消费者有哪些基本权利
    q: [金融消费者有什么权利, 消费者八项权利, 银行要保护我哪些权益]
    body: 银行保险机构要保护消费者的知情权、自主选择权、公平交易权、财产安全权、依法求偿权、受教育权、受尊重权和信息安全权。例如应以显著方式披露产品的性质、收益、费用、费率、主要风险、违约责任等关键信息。
    basis:
      - {doc: 银行保险机构消费者权益保护管理办法, ref: 第三章至第六章、第二十二条, docno: 中国银行保险监督管理委员会令2022年第9号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2023-03-01, url: "https://fgw.sh.gov.cn/cmsres/7d/7da9b54cc0b64677ae5b6dc71aa596fd/869e03a358291f6e8c8533c7771e280f.pdf"}

  - id: reg-complaint-channels
    title: 和银行有纠纷可以怎么解决、向谁投诉
    q: [对银行不满意怎么投诉, 银行投诉找哪个部门, 支付机构的投诉找谁, 消费纠纷怎么解决]
    body: 消费争议可以通过与经营者协商和解、请求消费者协会或调解组织调解、向有关行政部门投诉、按仲裁协议申请仲裁、向人民法院起诉等途径解决。金融投诉的分工是：对银行业金融机构、保险机构的投诉由国家金融监督管理总局统一接收转办；对非银行支付机构、征信机构的投诉由中国人民银行接收转办；证券期货基金业的投诉由中国证监会接收转办。建议先向本行投诉，也可以说「转人工」。
    basis:
      - {doc: 中华人民共和国消费者权益保护法, ref: 第三十九条, org: 全国人民代表大会常务委员会（2013 年修正）, effective: 2014-03-15}
      - {doc: 关于金融消费者权益保护相关工作安排的公告, ref: 第二条, docno: 2024年第1号, org: 国家金融监督管理总局、中国人民银行、中国证券监督管理委员会, effective: 2024-06-28, url: "https://fgw.sh.gov.cn/cmsres/f5/f5e2a29ec03b430e9fb5d24334fe9fd3/658f4843cb5561f812098004ba4de259.pdf"}

  - id: reg-pbc-complaint-time
    title: 向人民银行投诉多久有处理
    q: [向人民银行投诉多久回复, 投诉支付机构多久处理, 人民银行收到投诉后怎么办]
    body: 人民银行分支机构收到金融消费者投诉的，应当自收到之日起 7 个工作日内登记并作出是否接收的决定；决定接收的，转交被投诉机构处理或者转交金融消费纠纷调解组织调解。按 2024 年分工，人民银行接收的是对非银行支付机构、征信机构的投诉。
    basis:
      - {doc: 中国人民银行金融消费者权益保护实施办法, ref: 第四十三条, docno: 中国人民银行令〔2020〕第5号, org: 中国人民银行, effective: 2020-11-01, url: "https://fgw.sh.gov.cn/cmsres/f7/f7da09ea9e9546458f9727c0fdce45f5/50e3ea1957ea1b8ade058ef954adbe5e.pdf"}

  - id: reg-marketing-optout
    title: 银行营销短信电话可以退订
    q: [怎么拒收银行营销短信, 银行一直打推销电话, 退订营销信息]
    body: 银行保险机构通过电话呼叫、信息群发、网络推送等方式发送营销信息的，应当向消费者提供拒收或者退订选择；消费者拒收或者退订的，不得以同样方式再次发送营销信息。
    basis:
      - {doc: 银行保险机构消费者权益保护管理办法, ref: 第四十条, docno: 中国银行保险监督管理委员会令2022年第9号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2023-03-01, url: "https://fgw.sh.gov.cn/cmsres/7d/7da9b54cc0b64677ae5b6dc71aa596fd/869e03a358291f6e8c8533c7771e280f.pdf"}

  # ---------- 个人信息保护 ----------
  - id: reg-pi-sensitive
    title: 银行账户信息属于敏感个人信息
    q: [银行卡号是敏感信息吗, 金融账户信息怎么保护, 处理敏感个人信息要我同意吗]
    body: 金融账户、生物识别、行踪轨迹等信息属于敏感个人信息，一旦泄露或者非法使用，容易危害人身、财产安全。处理敏感个人信息应当取得个人的单独同意；法律、行政法规要求书面同意的，从其规定。
    basis:
      - {doc: 中华人民共和国个人信息保护法, ref: 第二十八条第一款、第二十九条, org: 全国人民代表大会常务委员会, effective: 2021-11-01, url: "https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm"}

  - id: reg-pi-rights
    title: 我对自己的个人信息有哪些权利
    q: [能要求银行删除我的信息吗, 怎么查阅银行收集了我哪些信息, 个人信息错了能改吗, 撤回同意]
    body: 个人对其个人信息的处理享有知情权、决定权；有权查阅、复制自己的个人信息；发现信息不准确或者不完整的，有权请求更正、补充；处理目的已实现、停止提供服务、撤回同意或者违法违约处理等情形下，处理者应当主动删除，没删除的个人有权请求删除。
    basis:
      - {doc: 中华人民共和国个人信息保护法, ref: 第四十四条至第四十七条, org: 全国人民代表大会常务委员会, effective: 2021-11-01, url: "https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm"}

  - id: reg-pi-bank-use
    title: 银行怎么收集和使用我的信息
    q: [银行收集个人信息的规定, 不同意授权银行还给我办业务吗, 银行能把我的信息给合作平台吗]
    body: 银行收集个人信息要告知目的、方式和范围并经同意；消费者不同意的，不得因此拒绝提供不依赖这些信息的产品或服务。未经同意，不得在不同平台间传递消费者个人信息；从业人员不得违规查询、下载、复制消费者个人信息。
    basis:
      - {doc: 银行保险机构消费者权益保护管理办法, ref: 第四十三条、第四十六条、第四十八条, docno: 中国银行保险监督管理委员会令2022年第9号, org: 中国银行保险监督管理委员会（现国家金融监督管理总局）, effective: 2023-03-01, url: "https://fgw.sh.gov.cn/cmsres/7d/7da9b54cc0b64677ae5b6dc71aa596fd/869e03a358291f6e8c8533c7771e280f.pdf"}
      - {doc: 中华人民共和国消费者权益保护法, ref: 第二十九条第一款, org: 全国人民代表大会常务委员会（2013 年修正）, effective: 2014-03-15}

  # ---------- 存款保险 ----------
  - id: faq-deposit-insurance
    title: 存款保险
    q: [存款保险保多少, 银行倒闭存款怎么办, 存款安全吗, 存款保险多久赔付, 理财在存款保险范围内吗]
    body: 存款保险实行限额偿付，最高偿付限额为人民币 50 万元：同一存款人在同一家银行所有被保险存款账户的本金和利息合并计算，限额以内全额偿付，超出部分依法从银行清算财产中受偿。被保险存款包括人民币存款和外币存款；理财产品不是存款。触发偿付的，存款保险基金管理机构应在 7 个工作日内足额偿付。
    basis:
      - {doc: 存款保险条例, ref: 第四条、第五条、第十九条, docno: 国务院令第660号, org: 国务院, effective: 2015-05-01}
