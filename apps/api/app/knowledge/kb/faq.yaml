# 规则 / FAQ 子库：本行（演示）业务规则。团队编写，参考公开资料改写，不照抄；规则是比赛原型参数，不代表任何真实银行的规定，
# 数字要和代码里的实际参数一致（policy/rules.yaml、core_mock/*）。监管和法律通用知识写在 regulation.yaml。
#
# 每条：
#   id     条目编号（字母 + 短横线，不要用 8 位以上的连续数字：发给模型前会被当成卡号脱敏）
#   title  条目标题，也是出处里的「条款」
#   q      用户可能的问法，只参与检索，不展示
#   body   条文，数字一律用阿拉伯数字（事实校验按数字比对）
# 入库前要过双人审核；加载时会扫描注入特征，命中的条目不入库。

library: faq
name: 常见问题
kind: 本行（演示）业务规则
version: kb-2026-10b
effective: 2026-10-31

entries:
  # ---------- 转账 ----------
  - id: faq-transfer-inner
    title: 本行转账多久到账
    q: [转给本行的人多久到账, 行内转账到账时间, 同行转账要多久]
    body: 向本行账户转账，确认并完成验证后实时到账，7×24 小时都可以办理。

  - id: faq-transfer-interbank
    title: 跨行转账多久到账
    q: [转到别的银行要多久, 跨行汇款到账时间, 他行转账什么时候到, 转外行多长时间到账]
    body: 跨行转账选择实时到账的，单笔 5 万元（含）以内一般实时到账；选择普通到账或次日到账的，按所选方式延后到账。对方银行系统维护时可能延迟。本行手机银行等非柜面渠道单日转出上限为 5 万元，更大金额需使用数字证书或到柜面办理。

  - id: faq-transfer-fee
    title: 转账手续费
    q: [转账要手续费吗, 跨行转账收费吗, 转账要钱吗, 汇款手续费多少]
    body: 通过手机银行办理本行转账、跨行转账均免收手续费（演示规则）。到柜台办理跨行汇款的，按网点公示标准收费。

  - id: faq-transfer-verify
    title: 转账为什么要人脸和短信验证
    q: [转账什么时候需要人脸验证, 什么情况要短信验证码, 转账验证规则, 为什么要刷脸]
    body: 当日累计转出不超过 1000 元、转给转过账的收款人，核对确认卡后点确认并完成验证即可；累计转出超过 1000 元、首次转给新收款人、5 分钟内第 3 笔起，需要人脸加短信双重验证。验证不能跳过。

  - id: faq-transfer-wrong
    title: 转错账怎么办
    q: [转账转错人了, 钱转错了能追回吗, 转错账号怎么办]
    body: 转账一经到账无法由本行单方面撤回。请先联系收款人协商退回；联系不上的，可以转人工，由客服协助向收款行发起查询。转账前请仔细核对确认卡上的收款人和金额。

  - id: faq-transfer-cooling
    title: 冷静期是什么
    q: [为什么转账有冷静期, 冷静期多长, 转账要等一会才能确认]
    body: 对话中出现疑似诈骗话术（如「安全账户」「刷单返利」「交解冻费」）时，系统会给出反诈提示并启动 30 秒冷静期，期间不能确认这笔转账。请先通过其他渠道核实对方身份。

  - id: faq-confirm-ttl
    title: 确认卡和验证码的有效期
    q: [确认卡多久失效, 验证码有效期多长, 确认卡过期了怎么办]
    body: 确认卡生成后 2 分钟内有效，过期需要重新发起；短信验证码 5 分钟内有效。确认卡上的内容就是实际执行的内容，核对无误再确认。

  - id: faq-aa
    title: AA 收款怎么用
    q: [AA 收款怎么发起, 怎么跟朋友 AA, 聚餐平摊怎么收钱]
    body: 说出总金额和参与的人（如「昨晚聚餐 600 元，我和小王小李 AA」），系统按人数平摊并生成确认卡；确认后向对方发送收款通知，对方付款后可以随时查询收款进度。

  - id: faq-scheduled-transfer
    title: 定时转账
    q: [可以预约转账吗, 每个月自动转钱给我妈, 定时转账怎么设置]
    body: 可以设置一次性或每月固定日期的定时转账。设置时需要确认一次；到期执行前系统会重新检查风险和余额，余额不足或风险升高时不会自动执行，会提醒你处理。

  # ---------- 银行卡 ----------
  - id: faq-card-lost
    title: 银行卡丢了怎么办
    q: [卡丢了怎么办, 银行卡找不到了, 卡被偷了怎么处理]
    body: 先在手机银行临时锁卡，锁卡立即生效、可以自助解锁；确认找不到后再办理挂失，挂失后卡片不能再使用，需要补办新卡。发现被盗刷请同时报警并转人工。

  - id: faq-card-lock-vs-loss
    title: 锁卡和挂失的区别
    q: [锁卡和挂失有什么区别, 冻结和挂失哪个好, 临时锁卡是什么]
    body: 锁卡是临时止损，卡片暂停交易，找到卡后自助解锁即可恢复，锁卡只需确认；挂失是正式声明卡片遗失，挂失后原卡立即停用，需要补卡。挂失、解锁和解除挂失都需要人脸加短信验证。

  - id: faq-card-loss-fee
    title: 挂失和补卡收费吗
    q: [信用卡挂失要钱吗, 挂失收费吗, 补卡工本费多少, 挂失要手续费吗]
    body: 在手机银行自助办理借记卡、信用卡挂失均免费（演示规则）。挂失后补办新卡，借记卡收取工本费 5 元，信用卡补卡免费；到网点办理的以网点公示为准。

  - id: faq-card-overseas
    title: 境外交易开关
    q: [怎么开通境外交易, 出国刷卡要开通什么, 境外消费功能]
    body: 卡片的境外交易、网上支付、ATM 取现都有单独开关，可以在手机银行自助开关。关闭（收紧）只需确认；开启（放宽）需要人脸加短信验证。出境前建议提前开通，回国后关闭。

  - id: faq-card-limit-rule
    title: 卡片交易限额怎么调整
    q: [怎么调整卡的限额, 单笔限额能改吗, 提高每日限额要什么验证]
    body: 卡片的单笔限额和单日限额可以在手机银行自助调整：调低只需确认；调高需要人脸加短信验证。你当前的限额以「查卡」结果为准。

  - id: faq-virtual-card
    title: 虚拟卡是什么
    q: [什么是虚拟卡, 一次性虚拟卡有什么用, 虚拟卡安全吗]
    body: 虚拟卡是绑定在借记卡上的电子卡号，可以设置单笔限额、限定商户，或设为一次性使用（用一次即失效），适合网购或在不熟悉的网站付款，避免泄露实体卡号。

  - id: faq-credit-repay
    title: 信用卡还款日和免息期
    q: [信用卡什么时候还款, 免息期多少天, 最低还款是多少, 信用卡还款规则]
    body: 账单日后第 20 天为到期还款日（演示规则）。到期前全额还款可享受免息期，最长 50 天；只还最低还款额（账单金额的 10%）的，未还部分按日计息，不享受免息。

  - id: faq-credit-overdue
    title: 信用卡逾期的后果
    q: [信用卡逾期会怎样, 晚还几天有影响吗, 逾期影响征信吗]
    body: 到期未还最低还款额即为逾期，会产生利息和违约金，并可能影响个人征信记录。到期还款日后 3 天内还款的视为宽限期内还款，不记逾期（演示规则）。

  # ---------- 理财 ----------
  - id: faq-wm-risk-level
    title: 理财产品风险等级 R1–R5 的含义
    q: [R2 是什么意思, 理财风险等级怎么看, R4 风险高吗, 中风险是几级]
    body: 产品风险等级分 5 级：R1 低风险、R2 中低风险、R3 中风险、R4 中高风险、R5 高风险。等级越高，净值波动和亏损的可能越大。具体产品的风险等级以产品信息为准。

  - id: faq-wm-assessment
    title: 风险测评规则
    q: [风险测评有效期多久, C3 是什么类型, 为什么要做风险测评, 测评结果怎么分级]
    body: 购买理财前需要完成风险测评，共 5 题，结果分为 C1 保守型、C2 稳健型、C3 平衡型、C4 成长型、C5 进取型，有效期 12 个月，过期需要重新测评。

  - id: faq-wm-suitability
    title: 能买什么风险等级的产品
    q: [为什么买不了这个理财, 测评等级和产品等级的关系, 风险等级不匹配怎么办]
    body: 只能购买风险等级不高于自己测评等级的产品，例如 C3 平衡型客户可以购买 R1–R3 的产品，C2 稳健型客户只能购买 R1–R2 的产品、不能购买 R4。等级不匹配时系统不会生成购买确认卡；是否匹配只按产品信息和测评结果判断。

  - id: faq-wm-redeem-arrival
    title: 理财赎回多久到账
    q: [理财赎回什么时候到账, 赎回资金几天到, T+1 是什么意思]
    body: 赎回到账时间按产品约定：现金管理类一般 T+0（当天到账），固定收益类和固收增强类一般 T+1，混合类 T+2，权益类 T+3。T 指提交赎回的交易日，遇节假日顺延。

  - id: faq-wm-closed-period
    title: 封闭期内能不能提前赎回
    q: [封闭期能赎回吗, 定期理财可以提前取出吗, 没到期能卖吗]
    body: 有封闭期的产品在封闭期内不能提前赎回，到期后自动赎回到活期；开放式产品可以随时申请赎回，持有时间不足约定天数的可能收取赎回费。

  - id: faq-wm-benchmark
    title: 业绩比较基准是不是收益承诺
    q: [业绩比较基准是什么, 年化收益是保证的吗, 理财会不会亏本]
    body: 业绩比较基准只是产品管理人设定的投资目标，不代表实际收益，也不是收益承诺。理财产品不保本，净值可能下跌，过往业绩不代表未来表现。

  - id: faq-wm-fees
    title: 理财申购费和赎回费
    q: [买理财要手续费吗, 赎回费怎么收, 申购费多少]
    body: 现金管理类和固定收益类产品不收申购费、赎回费；部分开放式产品收取申购费，并对持有不足约定天数（如 7 天或 30 天）的赎回收取赎回费，具体费率见各产品说明。

  # ---------- 订阅、代扣 ----------
  - id: faq-sub-stop-vs-cancel
    title: 停止代扣和取消订阅的区别
    q: [停了代扣会员还在吗, 停止代扣等于取消订阅吗, 为什么停了代扣还要去 App 里取消]
    body: 停止本行代扣（或免密支付）授权，只是让商户不能再从你的本行账户扣款；商户那边的会员自动续费仍可能有效，需要你按商户侧指引自己取消，否则商户可能改用其他付款方式续费。

  - id: faq-sub-withhold
    title: 代扣和免密支付是什么
    q: [什么是代扣, 免密支付是什么意思, 自动扣费是怎么来的]
    body: 代扣是你授权商户按约定定期从本行账户扣款（如话费自动缴费）；免密支付是授权商户在一定额度内扣款时不再输入密码。两者都可以在手机银行查看和停止，停止属于止损操作，随时可以办理。

  # ---------- 心愿罐、账户、通用 ----------
  - id: faq-wish-pot
    title: 心愿罐是什么
    q: [心愿罐怎么用, 心愿罐的钱能取出来吗, 什么是心愿罐]
    body: 心愿罐是活期账户下的专项子账户，适合为某个心愿（如给妈妈过生日）存钱，存入的钱不参与日常支出。心愿罐不计息、不承诺收益，可以随时释放，剩余的钱全部退回活期。



  - id: faq-anti-fraud
    title: 识别常见电信诈骗
    q: [安全账户是真的吗, 刷单返利可信吗, 自称公检法让转账, 解冻费是什么]
    body: 公检法机关不会要求转账到「安全账户」；「刷单返利」「先交保证金或解冻费」「冒充客服退款」都是常见诈骗话术。遇到要求转账的陌生来电或消息，先挂断并通过官方渠道核实，不要透露验证码。

  - id: faq-handoff
    title: 怎么联系人工客服
    q: [人工客服怎么找, 怎么转人工, 想跟真人说话]
    body: 在对话里说「转人工」即可。转人工后会生成接管记录，由客服接手处理；接管期间转账等办理暂停，查询照常可用。

  - id: faq-service-hours
    title: 手机银行服务时间
    q: [手机银行几点能用, 晚上能转账吗, 节假日能办业务吗]
    body: 手机银行 7×24 小时提供查询、本行转账、锁卡等服务；跨行大额转账、理财申购赎回的处理时间按各业务规则执行，节假日顺延。

  - id: faq-ai-scope
    title: 言行助手能做什么、不能做什么
    q: [你能帮我做什么, AI 助手会自己转账吗, 助手能替我确认吗]
    body: 言行可以帮你查询账户、转账和 AA 收款、分析账单、管理银行卡、推荐和买卖理财、管理订阅扣费，在合作商户订花订蛋糕、买鞋买书等，并解答常见业务规则。所有资金和账户变更都要你本人在确认卡上确认并完成验证后才执行，助手不能替你确认。

  # ---------- 转账（补充）----------
  - id: faq-non-counter-limit
    title: 手机银行每天最多能转多少
    q: [手机银行转账上限, 非柜面限额是多少, 一天最多转多少钱, 转账超过 5 万怎么办]
    body: 本行演示规则：手机银行等非柜面渠道单日转出上限为 5 万元，超出的需要使用数字证书或到柜面办理。另外，当日累计转出超过 1000 元的转账需要人脸加短信验证。

  - id: faq-transfer-return
    title: 跨行转账被退回（退汇）是怎么回事
    q: [转账被退回来了, 什么是退汇, 转账失败钱去哪了, 户名不对转账会怎样]
    body: 收款户名和账号不一致、收款账户已销户或被冻结等情况下，收款行会把跨行转账退回（退汇），资金原路退回你的付款账户，退回时间以收款行处理为准。转账前请核对确认卡上的户名和账号。

  # ---------- 账单分析 ----------
  - id: faq-bill-category
    title: 账单消费分类的口径
    q: [账单是怎么分类的, 为什么这笔消费分到了购物, 消费类别怎么判断, MCC 是什么]
    body: 消费按顺序分类：先看是不是自动代扣（订阅、缴费），再看商户类别码 MCC（如 5812 类为餐饮），再看商户名关键词；都分不出时才交给隔离模型从固定类别里选。类别有餐饮、购物、交通、居住、生活缴费、医疗、教育、娱乐、旅行、订阅、其他。

  - id: faq-bill-kinds
    title: 账单里的消费、转账、收入、退款怎么区分
    q: [给家人转账算消费吗, 工资算在哪, 收支是怎么统计的, 转账为什么不算支出分类]
    body: 账单分析把流水分成消费、转账、收入、退款四类：付给商户的是消费；转给他人的是转账，不计入消费分类；工资、他人转入记为收入；商户退回的钱记为退款。

  - id: faq-bill-refund
    title: 退款在账单里怎么算
    q: [退款算收入吗, 退货退款后消费金额会变吗, 订单取消退款怎么统计]
    body: 商户退回的消费款（退货退款、订单取消退款）冲减原来那笔消费所在的类目，不算收入，所以钱退回来后该类目的支出会相应减少；统计消费时按扣掉退款后的净额计算，整类都退光的不再出现在占比里。

  # ---------- 卡片（补充）----------
  - id: faq-card-fraud-steps
    title: 发现银行卡被盗刷怎么办
    q: [卡被盗刷了怎么办, 收到陌生扣款短信, 不是我刷的钱被扣了]
    body: 第一步立即锁卡止损（锁卡只需确认，任何时候都能办）；确认卡片信息泄露的再挂失并补卡；同时报警，保留交易短信、报警回执和挂失记录；然后转人工说明情况。未及时挂失导致损失扩大的部分可能要自己承担。

  - id: faq-card-bind
    title: 绑定他行银行卡
    q: [怎么绑定别的银行的卡, 绑卡为什么要刷脸, 添加银行卡要验证吗]
    body: 可以在查卡结果里点「绑定新卡」，把在其他银行开的借记卡添加进来。绑定新卡会多一个能付款的工具，是盗号后常见的第一步，所以绑卡需要人脸加短信验证。

  - id: faq-card-unbind
    title: 解绑银行卡会怎样
    q: [解绑银行卡有什么影响, 解绑后卡还能用吗, 怎么解除绑定]
    body: 解绑只是解除这张卡和本行 App 的绑定关系，解绑后不能再通过本行 App 用它付款；卡片本身、在发卡行的账户和余额都不受影响。

  - id: faq-card-full-number
    title: 查看完整卡号
    q: [怎么看完整卡号, 卡号为什么只显示后四位, 查看卡号要验证吗]
    body: 卡片默认只显示尾号。在卡片详情里查看完整卡号需要先通过人脸核验，通过后显示一次；审计只记录尾号，不记录完整卡号。

  # ---------- 理财（补充）----------
  - id: faq-wm-nav
    title: 净值为什么会跌
    q: [理财净值下跌了怎么办, 为什么理财会亏, 净值是什么意思, 理财收益是负的]
    body: 净值型理财按投资的债券、股票等资产的市场价格每天估值，市场下跌时净值随之下跌，可能低于买入时的价格；等级越高的产品波动越大。是否赎回要结合产品期限和自己的资金安排，赎回前可以先看持仓里的当前盈亏。

  - id: faq-wm-verify
    title: 买理财和赎回什么时候要人脸验证
    q: [申购理财要验证吗, 赎回为什么要刷脸, 理财赎回验证规则]
    body: 本行演示规则：申购理财一律需要人脸加短信验证；赎回时如果持有时间不足要收赎回费、按当前净值会亏损，或单笔金额达到 5 万元，也需要人脸加短信验证。风险测评结果比上次高时，保存也需要强验证。

  # ---------- 订阅（补充）----------
  - id: faq-sub-dispute
    title: 被自动续费扣了钱不想要怎么办
    q: [自动续费扣钱了能退吗, 会员续费没提醒怎么维权, 不想续费但已经扣了]
    body: 先停止本行代扣或免密支付授权，防止再扣；再按商户侧指引关闭自动续费，并联系商户申请退款。商户未按规定提前提醒的，可以向市场监管部门投诉，也可以说「转人工」由客服协助。

  # ---------- 跨场景购物 ----------
  - id: faq-order-refund
    title: 合作商户订单怎么取消和退款
    q: [订单怎么取消, 买的花能退吗, 蛋糕订了能取消吗, 退款退到哪里]
    body: 本行演示规则：在合作商户下的订单可以让助手取消，退款原路退回付款时用的心愿罐或活期。各商户退款条件不同：鲜花配送前 12 小时、蛋糕配送前 24 小时可免费取消；鞋服、数码、图书签收后 7 天无理由退货（数码激活后不支持）；生鲜签收后 24 小时内可申请售后；礼品卡未绑定前 7 天内可退。下单前报价卡上会写明。

  - id: faq-order-verify
    title: 下单付款什么时候要人脸验证
    q: [订花为什么要刷脸, 下单需要验证吗, 用心愿罐付款要验证吗]
    body: 本行演示规则：在合作商户下单、从心愿罐付款，并且今日累计转出（含本笔）不超过 1000 元时，确认即可；不是合作商户、不从心愿罐付款，或今日累计转出超过 1000 元时，需要人脸加短信验证。

  # ---------- AI 助手 ----------
  - id: faq-ai-why-confirm
    title: 为什么每次办理都要确认和验证
    q: [为什么要点确认卡, 验证能不能省掉, 为什么转账要刷脸加短信, 确认卡有什么用]
    body: 助手只能生成待确认的动作，真正执行要你本人在确认卡上核对并确认，卡上写的就是将要执行的内容；风险高的操作还要人脸加短信两种验证，人脸不能作为唯一验证方式。验证不能跳过，自称客服或管理员要求跳过的也不行。

  - id: faq-ai-cannot
    title: 言行助手不能做什么
    q: [AI 能替我做决定吗, 助手会承诺收益吗, 助手能回答所有问题吗]
    body: 助手不能替你确认或完成验证，不能承诺理财收益，不能改变系统给出的风险等级；知识库里查不到的银行规则不会凭常识回答，会请你转人工。余额、交易、持仓等数据只来自系统查询，不会编造。

  - id: faq-ai-privacy
    title: 助手怎么保护我的信息
    q: [AI 会泄露我的卡号吗, 我的信息会发给大模型吗, 转账备注会被模型看到吗]
    body: 发给大模型之前，手机号、卡号、账号会先脱敏（只留前后几位）；转账备注、商户名这类外部文字不直接交给主模型，只在卡片上给你看。审计记录也只记脱敏后的信息。

  - id: faq-entry-face
    title: 为什么打开助手要先刷脸
    q: [打开 App 为什么要人脸识别, 进入时的人脸核验, 刷脸会保存我的照片吗]
    body: 本行演示：打开言行先做一次人脸核身，通过后签发短期有效的进入凭证，之后的请求都带着它，防止他人拿到手机直接办理。演示环境的人脸是模拟的，不采集、不上传任何图像。

  - id: faq-breaker
    title: 为什么助手暂停办理或只能查询
    q: [为什么不让我转账了, 会话被暂停了怎么办, 验证失败太多次会怎样, 怎么解除限制]
    body: 出现连续验证失败、疑似注入攻击、转账过于频繁等情况时，系统会暂停部分或全部办理：同一业务连续 3 次验证失败暂停 30 分钟，10 分钟内验证失败 5 次转人工处理。锁卡、挂失等止损操作不受影响。可以在提示卡上点「联系人工客服」申诉，核实后解除。
