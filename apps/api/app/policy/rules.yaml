# 言行策略规则
# 阈值是比赛原型参数，不是法定线。风险只升不降：命中任何规则都只会把等级往上调。
#
# 每条规则：
#   tool_in    只对列出的写工具生效；不写表示对所有写工具生效
#   when       工具特有事实的相等条件，如 {direction: loosen}；不写时按 id（或 match）找内置匹配函数
#   elevate_to 命中后升到的等级
# 新场景只在末尾追加规则，不改已有规则。
version: p0-2026-10-30

rules:
  - id: cumulative_outflow
    tool_in: [transfer.create]
    window: natural_day              # natural_day；rolling_24h 在 M1 加
    yellow_max_fen: 100000           # 当日累计转出（已成功 + 待确认预占）≤ 1000 元走 🟡
    elevate_to: RED
    reason: "今日累计转出将达 {after} 元，超过 {limit} 元（含待确认金额）"

  - id: new_payee
    tool_in: [transfer.create]
    elevate_to: RED                  # 任意金额
    reason: "首次向该收款人转账"

  - id: velocity
    tool_in: [transfer.create]
    window_s: 300
    max_count: 3                     # 5 分钟内第 3 笔起上浮
    elevate_to: RED
    reason: "5 分钟内转账频繁"

  - id: injection_suspected       # 对所有写工具生效
    elevate_to: RED
    reason: "本轮对话含疑似绕过验证的指令"

  # ---------- WS1 转账补全 ----------
  - id: rolling_24h_outflow
    tool_in: [transfer.create]
    window_s: 86400
    yellow_max_fen: 100000           # 与当日累计同一阈值；只在「当日累计没超、跨零点的 24 小时累计超了」时命中，避免两条原因重复
    when: {rolling_24h_over: true}
    elevate_to: RED
    reason: "近 24 小时累计转出将超过 1000 元（跨零点累计，含待确认金额）"

  - id: split_evasion
    tool_in: [transfer.create]
    window_s: 3600
    min_prior: 2                     # 窗口内已有 2 笔及以上小额转给同一收款人（按账号），本笔是第 3 笔起
    small_max_fen: 100000            # 单笔 ≤ 1000 元算小额
    sum_over_fen: 100000             # 这几笔合计超过 1000 元
    when: {split_suspected: true}
    elevate_to: RED
    reason: "疑似拆单：1 小时内多笔小额转给同一收款人，合计超过 1000 元"

  - id: anti_fraud                   # 不限工具：哪个写工具的构造器标记了诈骗嫌疑都生效
    when: {fraud_suspected: true}
    combo_min_fen: 100000            # 「新收款人 + 大额 + 催促」组合里的大额：> 1000 元
    cooling_off_s: 30                # 冷静期（演示参数）：期间确认接口拒绝确认
    elevate_to: RED
    reason: "对话中出现疑似诈骗话术，已启动冷静期，请先核实对方身份"
  # ---------- 卡片管理（WS3）：收紧保护门槛低，放宽保护门槛高 ----------
  # direction 由系统比对卡片当前设置和目标值算出（开关打开 / 限额调高 = loosen），不由模型填写
  - id: card_loosen
    tool_in: [card.limit_set]
    when: {direction: loosen}
    elevate_to: RED
    reason: "放宽卡片交易限制（开启交易渠道或调高限额），需要本人强验证"

  # 解锁、解挂、挂失的工具默认等级已是 🔴，这几条规则给出原因，并在审计里留下命中记录
  - id: card_unlock
    tool_in: [card.unlock]
    when: {from_status: locked}
    elevate_to: RED
    reason: "解除临时锁定后卡片会恢复交易，需要本人强验证"

  - id: card_unreport
    tool_in: [card.unlock]
    when: {from_status: lost}
    elevate_to: RED
    reason: "解除挂失后卡片会恢复交易，需要本人强验证"

  - id: card_report_loss
    tool_in: [card.report_loss]
    when: {op: report_loss}
    elevate_to: RED
    reason: "正式挂失后原卡立即停用，需要本人强验证"

  - id: card_bind
    tool_in: [card.bind]
    when: {op: bind}
    elevate_to: RED
    reason: "绑定新卡会多一个能付款的工具（盗号后常见的第一步），需要本人强验证"
  # ---------- 理财（WS5）：适当性（R ≤ C、测评有效）在策略上下文的 block_reason 里硬拦截，这里只管定级 ----------
  # 事实由系统按当日净值和持仓算出（tools/wealth.py），不由模型填写
  - id: wealth_assess_raise
    tool_in: [wealth.assess_save]
    when: {raises: true}
    elevate_to: RED
    reason: "测评等级高于上次，可购买的产品范围扩大，需要本人强验证"

  - id: wealth_subscribe            # 申购工具默认等级已是 🔴，这条给出原因并在审计里留下命中记录
    tool_in: [wealth.subscribe]
    when: {op: subscribe}
    elevate_to: RED
    reason: "理财申购：已核对产品风险等级在你的风险承受能力之内；请阅读风险揭示，确认后需本人强验证"

  - id: wealth_redeem_early_fee
    tool_in: [wealth.redeem]
    when: {early_fee: true}
    elevate_to: RED
    reason: "持有时间不足，提前赎回要收取赎回费"

  - id: wealth_redeem_loss
    tool_in: [wealth.redeem]
    when: {at_loss: true}
    elevate_to: RED
    reason: "按当前净值赎回会产生亏损"

  - id: wealth_redeem_large
    tool_in: [wealth.redeem]
    min_fen: 5000000                 # 单笔赎回金额 ≥ 5 万元
    when: {large: true}
    elevate_to: RED
    reason: "单笔赎回金额达到 5 万元"

  # ---------- 跨场景联动（WS7）：心愿罐存入 / 释放、订单、定时转账都是 🟡 起步 ----------
  # order_fast_path 由系统算出：白名单商户 + 从心愿罐付款 + 今日累计转出（含本笔）≤ 1000 元
  - id: order_strong_auth
    tool_in: [order.pay]
    when: {order_fast_path: false}
    elevate_to: RED
    reason: "不是合作商户、不从心愿罐付款或今日累计转出超过 1000 元，需要本人强验证"

  # 定时转账创建时按单次金额 + 收款人风险定级；之后每期执行前重新定级，超过授权时的等级就请用户重新确认
  - id: schedule_large_amount
    tool_in: [schedule.transfer_create]
    when: {amount_over: true}
    elevate_to: RED
    reason: "定时转账单次金额超过 1000 元，创建授权需要本人强验证"

  - id: schedule_new_payee
    tool_in: [schedule.transfer_create]
    when: {payee_new: true}
    elevate_to: RED
    reason: "向从未转过账的收款人设置定时转账，需要本人强验证"

bank_hard_limits:
  non_counter_daily_max_fen: 5000000
  reason: "超出非柜面渠道单日 5 万元限额，须使用数字证书或到柜面办理（参考银发〔2016〕261 号）"

auth:
  YELLOW: []
  RED: [face, sms]                   # 人脸不能作为唯一因子
  sms_max_attempts: 3
